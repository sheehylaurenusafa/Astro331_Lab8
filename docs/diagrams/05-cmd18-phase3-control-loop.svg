<text text-anchor="start" x="1021.5" y="-170" font-family="Inter" font-weight="bold" font-size="20.00" fill="#404040">Why the wheel slows</text>
<text text-anchor="start" x="817.5" y="-152.4" font-family="Inter" font-size="17.00" fill="#404040">IMU and magnetometer see the body motion and close the loop every 50 ms.</text>
<text text-anchor="start" x="869.5" y="-135.4" font-family="Inter" font-size="17.00" fill="#404040">The fan torque is steady, so the wheel can only hold the heading</text>
<text text-anchor="start" x="914" y="-118.4" font-family="Inter" font-size="17.00" fill="#404040">by slowing down, which drains its stored momentum.</text>
</g>
